{% extends "panel/generic_list.html" %}
{% block list_tools %}
<form class="flex gap-1">
  {% if q %}<input type="hidden" name="q" value="{{ q }}">{% endif %}
  <select name="rol" class="input select" style="min-height:40px;width:auto" onchange="this.form.submit()" aria-label="Filtrar por rol">
    <option value="">Todos los roles</option>
    {% for value, label in roles %}<option value="{{ value }}" {% if role == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
</form>
{% endblock %}

<div class="lb-row {% if row.user.pk == user.pk %}me{% endif %}">
  <span class="pos">{{ row.rank }}</span>
  <div class="person">
    {% avatar row.user 38 %}
    <div><strong><a href="{% url 'accounts:public_profile' row.user.username %}" style="color:inherit">{{ row.user.display_name }}</a></strong><small class="muted">{{ row.level.name }}{% if row.user.supervisor %} · Equipo {{ row.user.supervisor }}{% endif %}</small></div>
  </div>
  <span class="hide-sm">{% icon "award" 15 "muted" %} {{ row.certs }}</span>
  <span class="hide-sm">{% if row.avg is not None %}{{ row.avg }}%{% else %}—{% endif %}</span>
  <span class="pts">{{ row.points }}</span>
</div>
